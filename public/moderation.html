<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Краудфандинг | Модерація</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    </head>
    <body>
        <nav class="navbar bg-dark border-bottom border-body px-4" data-bs-theme="dark">
            <a class="navbar-brand" href="/">Краудфандинг</a>
            <div>
                <span id="username" class="navbar-text me-4"></span>
                <a id="modbutton" class="btn btn-warning btn-sm me-2 d-none" href="/moderation.html">Модерація</a>
                <a id="authbutton" class="btn btn-outline-light btn-sm" href="/auth.html">Увійти / Зареєструватися</a>
            </div>
        </nav>

    <main class="container my-4">
        <h1 class="h3 mb-3">Заявки на розгляді</h1>
        <p id="empty" class="text-muted d-none">Нових заявок немає.</p>
        <div id="list"></div>
    </main>
            
    <div class="modal fade" id="rejectModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="reject-form">
                    <div class="modal-header">
                        <h2 class="modal-title h5">Відхилити проєкт</h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрити"></button>
                    </div>
                    <div class="modal-body">
                        <div id="reject-error" class="alert alert-danger d-none"></div>
                        <label class="form-label" for="reason">Причина відхилення</label>
                        <textarea class="form-control" id="reason" name="reason" rows="4" required></textarea>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Скасувати</button>
                        <button type="submit" class="btn btn-danger">Відхилити</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
        <script type="module" src="/js/moderation.js"></script>
        <script type="module" src="/js/authbutton.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
