<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Краудфандинг | Увійти / Зареєструватися</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    </head>
<body>
    <nav class="navbar bg-dark border-bottom border-body px-4" data-bs-theme="dark">
        <a class="navbar-brand" href="/">Краудфандинг</a>
    </nav>

    <main class="container my-4">
        <div class="container my-5" style="max-width: 400px;">
            <form id="login-form">
                <h1 class="h4 mb-3">Вхід</h1>
                <input class="form-control mb-2" name="username" placeholder="Логін" required>
                <input class="form-control mb-3" type="password" name="password" placeholder="Пароль" required>
                <button class="btn btn-primary w-100" type="submit">Увійти</button>
                <button class="btn btn-link w-100 mt-2" type="button" id="show-register">Немає акаунта? Зареєструватися</button>
            </form>
            <form id="register-form" class="d-none">
                <h1 class="h4 mb-3">Реєстрація</h1>
                <input class="form-control mb-2" name="username" placeholder="Логін" required>
                <input class="form-control mb-2" type="password" name="password" placeholder="Пароль" required>
                <input class="form-control mb-3" type="password" name="password2" placeholder="Повторіть пароль" required>
                <button class="btn btn-success w-100" type="submit">Створити акаунт</button>
                <button class="btn btn-link w-100 mt-2" type="button" id="show-login">Вже є акаунт? Увійти</button>
            </form>
        </div>
    </main>

    <script src="/js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
