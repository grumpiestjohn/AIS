<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Краудфандинг</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    </head>
    <body>
        <nav class="navbar bg-dark border-bottom border-body px-4" data-bs-theme="dark">
            <a class="navbar-brand" href="/">Краудфандинг</a>
            <div>
                <span id="username" class="navbar-text me-4"></span>
                <a id="modbutton" class="btn btn-warning btn-sm me-2 d-none" href="/moderation.html">Модерація</a>
                <a id="authbutton" class="btn btn-outline-light btn-sm" href="/auth.html">Увійти / Зареєструватися</a>
            </div>
        </nav>

        <main class="container my-4">
            <section id="my-section" class="mb-5 d-none">
                <h2 class="h3 mb-3">Мої проєкти</h2>
                <p id="my-empty" class="text-muted d-none">У вас ще немає проєктів.</p>
                <div id="my-projects" class="row g-3"></div>
            </section>
            <h1 class="h3 mb-3">Активні проєкти</h1>
            <p id="empty" class="text-muted d-none">Активних проєктів поки немає...</p>
            <div id="projects" class="row g-3"></div>
        </main>
        
        <button id="fab" type="button"
        class="btn btn-success rounded-circle shadow-lg position-fixed bottom-0 end-0 m-4 d-none"
        style="width: 56px; height: 56px; font-size: 28px; line-height: 1;"
        data-bs-toggle="modal" data-bs-target="#projectModal"
        title="Створити проєкт">+</button>
        <div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-scrollable">
                <div class="modal-content">
                    <div class="modal-header border-0">
                        <div>
                            <span id="d-status" class="badge mb-1"></span>
                            <h2 id="d-title" class="modal-title h4"></h2>
                            <small id="d-author" class="text-muted"></small>
                        </div>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрити"></button>
                    </div>
                    <div class="modal-body mx-3 px-0 border-top border-bottom">
                        <p id="d-description" class="mb-4" style="white-space: pre-wrap;"></p>
                        <div class="progress mb-2" style="height: 10px;">
                            <div id="d-bar" class="progress-bar"></div>
                        </div>
                        <small id="d-amounts" class="d-block"></small>
                        <small id="d-end" class="text-muted d-block"></small>
                        <small id="d-count" class="text-muted d-block"></small>
                        <h3 class="h6 mt-3 mb-2">Історія внесків</h3>
                        <ul id="d-contribs" class="list-unstyled small mb-0"></ul>
                        <div id="d-error" class="alert alert-danger mt-3 d-none"></div>
                    </div>
                    <div class="modal-footer border-0">
                        <button id="btn-remove" type="button" class="btn btn-danger d-none">Вилучити</button>
                        <button id="btn-close-project" type="button" class="btn btn-warning d-none">Закрити зараз</button>
                        <button id="btn-contribute" type="button" class="btn btn-success d-none">Зробити внесок</button>
                    </div>
                </div>
            </div>
    </div>
        <div class="modal fade" id="contribModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-sm">
                <div class="modal-content">
                    <form id="contrib-form">
                        <div class="modal-header">
                            <h2 class="modal-title h5">Внесок</h2>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрити"></button>
                        </div>
                        <div class="modal-body">
                            <div id="contrib-error" class="alert alert-danger d-none"></div>
                            <label class="form-label" for="amount">Сума (грн)</label>
                            <input class="form-control mb-3" type="number" id="amount" name="amount" min="1" step="1" required>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="is_anon" name="is_anon">
                                <label class="form-check-label" for="is_anon">Зробити анонімно</label>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Скасувати</button>
                            <button type="submit" class="btn btn-success">Надіслати</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="modal fade" id="projectModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form id="project-form">
                        <div class="modal-header">
                            <h2 class="modal-title h5">Новий проєкт</h2>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрити"></button>
                        </div>
                        <div class="modal-body">
                            <div id="project-error" class="alert alert-danger d-none"></div>
                            <div class="mb-3">
                                <label class="form-label" for="title">Назва</label>
                                <input class="form-control" id="title" name="title" maxlength="100" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="description">Опис</label>
                                <textarea class="form-control" id="description" name="description" rows="4" required></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="goal_amount">Цільова сума (грн)</label>
                                <input class="form-control" type="number" id="goal_amount" name="goal_amount" min="1" step="1" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="duration_days">Тривалість збору (днів, 1-60)</label>
                                <input class="form-control" type="number" id="duration_days" name="duration_days" min="1" max="60" step="1" required>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Скасувати</button>
                            <button type="submit" class="btn btn-success">Надіслати на розгляд</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <script src="/js/index.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script type="module" src="/js/authbutton.js"></script>
        <script type="module" src="/js/create.js"></script>
        <script type="module" src="/js/project.js"></script>
    </body>
</html>
